# ---------------------------------------------------------------------------
# Duora — Render blueprint (one click) — "duora/" folder as the repo root
#
# Use this file when you set the Render Root Directory to `duora`.
# If you keep the repository root as the root directory, use ../render.yaml.
#
#   Render → New → Blueprint → connect this repo → Apply
#
# Creates ONE thing:
#   duora — a Node web service running the Express + Socket.IO API
#
# The database is Supabase Postgres (you already have the project), so there is
# nothing to provision here. The only value you have to paste is the Supabase
# connection string — Render asks for it while creating the blueprint:
#
#   Supabase → Project Settings → Database → Connection string → URI
#   → reset the password if you have never seen it
#   → use the pooled host (…pooler.supabase.com) because Render has no IPv6
#
# Everything else is filled in for you: the JWT secrets are generated, the
# schema is created on the first boot, and the demo couple is seeded.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: duora
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    region: singapore
    healthCheckPath: /health
    # Every merge to main ships straight to the live API.
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # ↓↓↓  The only value you paste in. Supabase → Settings → Database.
      - key: DATABASE_URL
        sync: false
      # Render generates the two signing secrets for you.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TTL
        value: 1h
      - key: REFRESH_TTL_DAYS
        value: 30
      - key: APP_VERSION
        value: 3.0.0
      - key: REGION
        value: Singapore · ap-southeast
      - key: PAIRING_TTL_MINUTES
        value: 10
      # Avatars and memory photos are served by the API itself.
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: duora
          envVarKey: RENDER_EXTERNAL_URL
      # Creates the schema on boot and fills the demo couple.
      - key: SEED_ON_BOOT
        value: "true"
      # How long to keep retrying while Supabase wakes up (12 × 5 s = 1 minute).
      - key: DB_CONNECT_ATTEMPTS
        value: "12"
      - key: DB_CONNECT_DELAY_MS
        value: "5000"
