# ---------------------------------------------------------------------------
# Duora — Render blueprint
#
#   Render → New → Blueprint → connect this repo → Apply
#
# Creates:
#   1. duora-server — a Node web service running the Express + Socket.IO API
#      (Dockerfile in duora/server/Dockerfile)
#   2. duora-db     — a managed PostgreSQL instance (free tier, 2 people is plenty)
#
# The API migrates the schema on every boot, so there is no separate migration
# step. Point the mobile app at the service URL:
#      EXPO_PUBLIC_API_URL=https://duora.onrender.com
# ---------------------------------------------------------------------------

databases:
  - name: duora-db
    databaseName: duora
    user: duora
    plan: free
    postgresMajorVersion: "16"
    region: singapore

services:
  - type: web
    name: duora
    runtime: docker
    dockerfilePath: ./duora/server/Dockerfile
    dockerContext: ./duora/server
    plan: free
    region: singapore
    healthCheckPath: /health
    # Every merge to main ships straight to the live API.
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: duora-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TTL
        value: 1h
      - key: REFRESH_TTL_DAYS
        value: 30
      - key: APP_VERSION
        value: 2.0.0
      - key: REGION
        value: Singapore · ap-southeast
      - key: PAIRING_TTL_MINUTES
        value: 10
      # Avatars and memory photos are served by the API itself.
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: duora
          envVarKey: RENDER_EXTERNAL_URL
      - key: SEED_ON_BOOT
        value: "true"
