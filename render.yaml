# Render blueprint for Duora — personal lightweight deployment
# Commit this file, then in Render: New → Blueprint → Connect repo → Apply
#
# It creates:
#   1. A Node web service (duora-server) from ./duora/server
#   2. A managed PostgreSQL (duora-db) — free tier suitable for 2-person use
#
# Docs: https://render.com/docs/blueprint-spec
# Full guide: duora/docs/deployment.md#render-free-tier

services:
  - type: web
    name: duora-server
    runtime: node
    plan: free                 # personal use — sleeps after 15 min idle; wakes on request
    region: singapore          # closest to Jaipur/Rajasthan; change to oregon/frankfurt if preferred
    rootDir: duora/server
    # --include=dev is REQUIRED: NODE_ENV=production (below) makes a bare `npm ci`
    # skip devDependencies, so tsc/@types/node would be missing and the build fails
    # with "Cannot find type definition file for 'node'".
    # `npm run build` = `prisma generate && tsc -p tsconfig.json` → emits dist/server.js
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /health
    autoDeploy: false          # manual deploys — flip to true after you verify
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"              # pin Node 22 LTS — without this Render picks the
                               # newest Node (26.x), which Prisma 6 + @types/node 20
                               # are not built for. .node-version does the same.
      - key: PORT
        value: 10000           # Render injects PORT=10000; server reads env.PORT
      - key: DATABASE_URL
        fromDatabase:
          name: duora-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true    # Render generates a random secret
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://duora-server.onrender.com  # replace after you know your URL
      - key: CORS_ORIGINS
        value: ""
      - key: LOG_LEVEL
        value: warn            # lightweight: less I/O on free tier
      # Optional — leave empty to skip push/TURN (app still works):
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: TURN_SECRET
        sync: false
      - key: TURN_URLS
        sync: false
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302
      - key: INVITATION_TTL_MINUTES
        value: 10
      - key: ATTACHMENTS_ENABLED
        value: false           # lightweight: disable binary uploads for personal use
      - key: ANDROID_LATEST_VERSION
        value: 1.0.0
      - key: ANDROID_MIN_SUPPORTED_VERSION
        value: 1.0.0
      - key: ANDROID_RELEASE_URL
        value: https://github.com/sukhdevr898/Duora/releases

databases:
  - name: duora-db
    plan: free                 # 256MB RAM, 1GB storage — ample for 2-person chat
    region: singapore
    ipAllowList: []            # only the duora-server service can connect
